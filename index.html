<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Happy Birthday Dear 💗</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(135deg,#ffb6d5,#ffdff0 50%,#fff);color:#7a2450;min-height:100vh;overflow:hidden}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:min(420px,94vw);min-height:650px;background:rgba(255,255,255,.78);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.9);border-radius:30px;box-shadow:0 20px 60px rgba(177,52,111,.25);text-align:center;padding:28px 22px;position:relative;overflow:hidden}
h1{font-size:34px;margin:8px 0 4px;color:#d72f78} .sub{font-size:18px;margin-bottom:18px}
.photo{width:230px;height:300px;object-fit:cover;border-radius:24px;border:6px solid white;box-shadow:0 12px 30px rgba(150,30,85,.25);opacity:0;transform:scale(.85);transition:1s}
.show .photo{opacity:1;transform:scale(1)}
.gift{font-size:88px;border:0;background:none;cursor:pointer;filter:drop-shadow(0 8px 12px rgba(200,40,100,.2));animation:bob 1.7s infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(2deg)}}
.message{font-size:18px;line-height:1.55;margin:18px 8px;opacity:0;transform:translateY(15px);transition:.9s}
.show .message{opacity:1;transform:translateY(0)}
.btn{background:#e83e86;color:white;border:0;border-radius:999px;padding:13px 22px;font-size:16px;cursor:pointer;box-shadow:0 8px 20px rgba(232,62,134,.3)}
.hint{font-size:13px;opacity:.7;margin-top:10px}
.heart{position:absolute;animation:float 5s linear forwards;pointer-events:none}
@keyframes float{from{transform:translateY(0) scale(.8);opacity:0}15%{opacity:1}to{transform:translateY(-760px) scale(1.3);opacity:0}}
.hidden{display:none}
</style>
</head>

<script>
const card=document.getElementById('card'), intro=document.getElementById('intro'), content=document.getElementById('content');
document.getElementById('gift').onclick=()=>{intro.classList.add('hidden');content.classList.remove('hidden');card.classList.add('show');burst();};
document.getElementById('more').onclick=()=>{burst(28);alert('Happy Birthday! 💗 May all your wishes come true! ✨');};
function burst(n=18){
 for(let i=0;i<n;i++){
  const h=document.createElement('div');h.className='heart';h.textContent=['💗','💖','💕','✨'][Math.floor(Math.random()*4)];
  h.style.left=(5+Math.random()*90)+'%';h.style.bottom='-30px';h.style.fontSize=(16+Math.random()*22)+'px';h.style.animationDuration=(3+Math.random()*3)+'s';
  document.body.appendChild(h);setTimeout(()=>h.remove(),6500);
 }
}
